<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MY WEBSITE</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    h1 {
      color: red;
      text-align: center;
      font-style: italic;
      background-color: black;
    }
    h4 {
      color: orange;
      text-align: center;
      background-color: aliceblue;
    }
    h6 {
      color: aqua;
    }
    body {
      background-color: bisque;
    }

    .my {
      background-image: linear-gradient(#e42525, #9fba9c, black);
      color: white;
      padding: 40px;
      border-radius: 30px;
      text-align: center;
      border: 3px dotted white;
    }

   img {
  width: 100%;
  height: auto;
  display: block;
}


    #btn:hover {
      background: orange;
      cursor: pointer;
    }

   nav {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-around;
  background-color: #aaf0d1;
}

nav a {
  flex: 1 1 auto;
  text-align: center;
  padding: 10px;
  font-size: 1em;
}
@media screen and (max-width: 600px) {
  nav a {
    font-size: 0.9em;
    padding: 8px;
  }

  form {
    padding: 15px;
  }

  h1 {
    font-size: 1.2em;
  }
}


    h5 {
      background-color: blue;
      text-align: center;
      color: gold;
      font-style: oblique;
    }
    form {
  max-width: 90%;
  width: 400px;
  margin: 20px auto;
  padding: 20px;
  background: linear-gradient(to bottom, #ff0000, #006400, #000000);
  border-radius: 15px;
  box-shadow: 0 0 10px #000;
}

input {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  font-size: 1em;
  border: none;
  border-radius: 5px;
}

button, input[type="submit"] {
  padding: 10px 15px;
  background-color: #ffa500;
  border: none;
  color: white;
  border-radius: 5px;
  width: 100%;
}

  </style>
</head>

<body>
  <div class="container-fluid">
    <h1>STEVEN CYCLE TRADERS</h1>

    <marquee scrollamount="20">
      <h4>Finding my balance in life, one ride at a time.</h4>
    </marquee>
    <hr>

    <!-- Navigation -->
    <nav>
      <ul class="nav nav-pills nav-fill">
        <li class="nav-item"><a class="nav-link" href="company.html">COMPANY INFO</a></li>
        <li class="nav-item"><a class="nav-link" href="management.html">MANAGEMENT</a></li>
        <li class="nav-item"><a class="nav-link" href="brands.html">OUR BRANDS</a></li>
        <li class="nav-item"><a class="nav-link" href="branch.html">BRANCHES</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT US</a></li>
      </ul>
      <hr>
    </nav>

    <!-- Image Section -->
    <div class="row my-3">
      <div class="col-12">
        <img src="images/1.jpg" alt="Cycle Banner" class="img-fluid">
      </div>
    </div>

    <!-- Form Section -->
    <div class="row justify-content-center mb-5">
      <div class="col-md-6 col-sm-10">
        <form name="myform" onsubmit="return validateForm()" method="post" class="my">
          <h6>USER ENQUIRY</h6>
          <div class="mb-3">
            <input type="text" name="fname" placeholder="Enter Name" class="form-control" style="outline: none;">
          </div>
          <div class="mb-3">
            <input type="text" name="faddress" placeholder="Enter Address" class="form-control" style="outline: none;">
          </div>
          <div class="mb-3">
            <input type="number" name="contact" placeholder="Enter No" class="form-control" style="outline: none;">
          </div>
          <input type="submit" value="Submit" id="btn" class="btn btn-warning">
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <h5>@COPYRIGHT RESERVED BY STEVEN, 2025</h5>
  </footer>

  <!-- Validation Script -->
  <script>
    function validateForm() {
      let x = document.forms["myform"]["fname"].value;
      if (x == "") {
        alert("Name must be filled out");
        return false;
      }

      let y = document.forms["myform"]["faddress"].value;
      if (y == "") {
        alert("Address must be filled");
        return false;
      }

      let z = document.forms["myform"]["contact"].value;
      if (z == "") {
        alert("Contact must be filled");
        return false;
      } else {
        alert("Successful");
      }
    }
  </script>
</body>
</html>
