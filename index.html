<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steven Cycle Traders</title>
  <style>
    /* General Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #d2b48c;
      color: #000;
    }

    /* Header */
    header {
      background-color: #000;
      color: red;
      text-align: center;
      padding: 10px 0;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .tagline {
      text-align: center;
      color: orange;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    /* Navbar */
    .navbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      background-color: #66cdaa;
      padding: 10px 0;
    }

    .navbar a {
      color: #000;
      padding: 10px 15px;
      text-decoration: none;
      font-weight: bold;
    }

    .navbar a:hover {
      background-color: #333;
      color: #fff;
    }

    /* Image */
    .hero-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
    }

    /* Enquiry Form */
    .user-enquiry {
      max-width: 400px;
      margin: 20px auto;
      background: linear-gradient(to bottom, #ff4d4d, #000);
      padding: 20px;
      border-radius: 10px;
      color: #fff;
    }

    .user-enquiry h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.2rem;
      color: #00ffff;
    }

    .user-enquiry input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 5px;
    }

    .user-enquiry button {
      width: 100%;
      background-color: gold;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .user-enquiry button:hover {
      background-color: #ffa500;
    }

    /* Footer */
    footer {
      background-color: #0000cd;
      color: #fff;
      text-align: center;
      padding: 10px 0;
      font-size: 0.9rem;
      margin-top: 40px;
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        align-items: center;
      }

      .navbar a {
        width: 100%;
        text-align: center;
        padding: 12px 0;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>STEVEN CYCLE TRADERS</header>
  <div class="tagline">Finding my balance in life, one ride at a time.</div>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="#">COMPANY INFO</a>
    <a href="#">MANAGEMENT</a>
    <a href="#">OUR BRANDS</a>
    <a href="#">BRANCHES</a>
    <a href="#">CONTACT US</a>
  </nav>
</header>
      <!-- Image Section -->

    <div class="row my-3">

      <div class="col-12">

        <img src="images/1.jpg" alt="Cycle Banner" class="img-fluid">

      </div>

    </div>
  <section class="form-section">
      <h2>User Enquiry</h2>
      <form>
        <input type="text" placeholder="Enter Name" />
        <input type="text" placeholder="Enter Address" />
        <input type="text" placeholder="Enter No" />
        <button type="submit">Submit</button>
      </form>
    </section>


  <footer>
    <p>&copy; Copyright Reserved by Steven, 2025</p>
  </footer>
</body>
</html>


  <!-- Validation Script -->
  <script>
    function validateForm() {
      let x = document.forms["myform"]["fname"].value;
      if (x == "") {
        alert("Name must be filled out");
        return false;
      }

      let y = document.forms["myform"]["faddress"].value;
      if (y == "") {
        alert("Address must be filled");
        return false;
      }

      let z = document.forms["myform"]["contact"].value;
      if (z == "") {
        alert("Contact must be filled");
        return false;
      } else {
        alert("Successful");
      }
    }
  </script>
</body>
</html>
