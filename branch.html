<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Branches</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  <style>
    h5 {
      color: violet;
    }
    p {
      color: brown;
    }
  </style>
</head>

<body style="background-color: #f9f5f0;">

  <!-- Header -->
  <div class="container my-4">
    <h1 class="text-center text-danger fw-bold">OUR ALL BRANCHES</h1>
    <hr class="mx-auto" style="width: 60%;">
  </div>

  <!-- Carousel -->
  <div class="container mb-5">
    <div id="carouselExampleCaptions" class="carousel slide carousel-fade" data-bs-ride="carousel">
      
      <!-- Indicators -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Mira Road"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Vasai"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Andheri"></button>
      </div>

      <!-- Carousel Slides -->
      <div class="carousel-inner rounded shadow">

        <div class="carousel-item active">
          <img src="images/1.jpg" class="d-block w-100" alt="Mira Road Branch">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3">
            <h5>MIRA ROAD</h5>
            <p>Shop no.3, Shanti Shopping Centre, near Railway Station, Mira Road.</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="2.jpg" class="d-block w-100" alt="Vasai Branch">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3">
            <h5>VASAI</h5>
            <p>Shop no.1, Tungareshwar Sweets, near Railway Station, Vasai West.</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="images/3.jpg" class="d-block w-100" alt="Andheri Branch">
          <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50 rounded p-3">
            <h5>ANDHERI</h5>
            <p>Shop no.4, Moksh Plaza, near Railway Station, Andheri West.</p>
          </div>
        </div>

      </div>

      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>

    </div>
  </div>

</body>
</html>
